alertmanager:
  alertmanagerSpec:
    secrets:
      - ecom-polyglot-app-alert-secret

  config:
    global:
      smtp_smarthost: "smtp.gmail.com:587"
      smtp_from: "amethajayawardena@gmail.com"
      smtp_auth_username: "amethajayawardena@gmail.com"
      smtp_auth_password_file: /etc/alertmanager/secrets/ecom-polyglot-app-alert-secret/SMTP_PASSWORD
      smtp_require_tls: true

    route:
      receiver: "null"
      group_by:
        - namespace
        - alertname
        - service
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "app-email"
          matchers:
            - 'alertname=~"AuthHttp5xxRateAboveOnePercent|OrdersHttp5xxRateAboveOnePercent"'

    receivers:
      - name: "null"
      - name: "app-email"
        email_configs:
          - to: "amethacodes@gmail.com"
            send_resolved: true