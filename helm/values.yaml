  replicaCount: 1

  image:
    repository: notification-service
    tag: v2
  
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  
  service:
    type: ClusterIP
    port: 8086

# Orders service
orders:
  replicaCount: 1

  image:
    repository: order-service
    tag: v2
  
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  service:
    type: ClusterIP
    applicationPort: 8084
    metricsPort: 9091

# Payments service
payments:
  replicaCount: 1

  image:
    repository: payment-service
    tag: v2
  
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  
  service:
    type: ClusterIP
    port: 8085

# Analytics service
analytics:
  replicaCount: 1

  image:
    repository: analytics-service
    tag: v2
  
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  
  service:
    type: ClusterIP
    port: 8087

nameOverride: ""
fullnameOverride: ""