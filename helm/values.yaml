---
# Global config
global:
  image:
    pullPolicy: Never
  
  database:
    user: ""
    password: ""

# Auth service
auth:
  replicaCount: 1

  image:
    repository: auth-service
    tag: v2

  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  
  service:
    type: ClusterIP
    port: 8081

# Catalog service
catalog:
  replicaCount: 1

  image:
    repository: catalog-service
    tag: v2
  
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  
  service:
    type: ClusterIP
    port: 8082

# Inventory service
inventory:
  replicaCount: 1

  image:
    repository: inventory-service
    tag: v2

nameOverride: ""
fullnameOverride: ""