---
# Global config
global:
  image:
    pullPolicy: Never
  
  database:
    credentialSecret: ecom-polyglot-db-credentials
    usernameKey: DB_USER
    passwordKey: DB_PASSWORD

# Auth service
auth:
  replicaCount: 1

  image:
    repository: auth-service
    tag: v2

  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  
  service:
    type: ClusterIP
    port: 8081

nameOverride: ""
fullnameOverride: ""