---
# Global config
global:
  image:
    pullPolicy: Never
  
  database:
    credentialSecret: ecom-polyglot-db-credentials
    usernameKey: DB_USER
    passwordKey: DB_PASSWORD

# Auth service
auth:
  image:
    repository: auth-service
    tag: v2
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  replicaCount: 1

nameOverride: ""
fullnameOverride: ""