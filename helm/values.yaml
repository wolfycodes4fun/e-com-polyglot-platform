---
# Global config
global:
  image:
    pullPolicy: Never
  
  database:
    user: ""
    password: ""

# Postgres database
postgres:
  postgresUser: ""
  postgresUserPassword: ""

  image:
    repository: postgres
    tag: 17-alpine

  service:
    port: 5432
  
  storage:
    size: 10Gi
  
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Auth service
auth:
  replicaCount: 1

  image:
    repository: auth-service
    tag: v2

  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  
  service:
    type: ClusterIP
    applicationPort: 8081
    metricsPort: 9091

# Catalog service
catalog:
  replicaCount: 1

  image:
    repository: catalog-service
    tag: v2
  
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  
  service:
    type: ClusterIP
    port: 8082

# Inventory service
inventory:
  replicaCount: 1

  image:
    repository: inventory-service
    tag: v2
  
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  
  service:
    type: ClusterIP
    port: 8083

# Notifications service
