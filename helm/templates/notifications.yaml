---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecom-polyglot-platform.fullname" . }}-notifications
  labels:
    {{- include "ecom-polyglot-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: notifications
spec:
  replicas: {{ .Values.notifications.replicaCount }}
  selector:
    matchLabels:
      {{- include "ecom-polyglot-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: notifications
  template:
    metadata:
      labels:
        {{- include "ecom-polyglot-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: notifications
    spec:
      containers:
        - name: notifications
          image: "{{ .Values.notifications.image.repository }}:{{ .Values.notifications.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.notifications.service.applicationPort }}
              protocol: TCP
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecom-polyglot-platform.fullname" . }}-secret
                  key: DB_USER
            
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecom-polyglot-platform.fullname" . }}-secret
                  key: DB_PASSWORD
            
            - name: NOTIFICATION_DB_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@postgres-headless-service:{{ .Values.postgres.service.port }}/notification_db"

---
apiVersion: v1
kind: Service
metadata:
  name: notifications-service
  labels:
    {{- include "ecom-polyglot-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: notifications
spec:
  type: {{ .Values.notifications.service.type }}
  ports:
    - name: http
      port: {{ .Values.notifications.service.applicationPort }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ecom-polyglot-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: notifications
