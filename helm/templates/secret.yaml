apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "ecom-polyglot-platform.fullname" . }}-secret"
  labels:
    {{- include "ecom-polyglot-platform.labels" . | nindent 4 }}
type: Opaque
data:
  DB_USER: {{ .Values.global.database.user | b64enc | quote }}
  DB_PASSWORD: {{ .Values.global.database.password | b64enc | quote }}
