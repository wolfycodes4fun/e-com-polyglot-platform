apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "ecom-polyglot-platform.fullname" . }}-secret"
  labels:
    {{- include "ecom-polyglot-platform.labels" . | nindent 4 }}
type: Opaque
data:
  DB_USER: {{ .Values.postgres.password | b64enc | quote }}
  DB_PASSWORD: {{ .Values.postgres.password | b64enc | quote }}
  POSTGRES_USER: {{ .Values.postgres.sudoUser | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.sudoUserPassword | b64enc | quote }}
