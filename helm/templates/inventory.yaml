---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecom-polyglot-platform.fullname" . }}-inventory
  labels:
    {{ include "ecom-polyglot-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: inventory
spec:
  replicaCount: {{ .Values.inventory.replicaCount }}
  selectorLabels:
    matchLabels:
      {{- include "ecom-polyglot-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: inventory
  template:
    metadata:
      labels:
        {{- include "ecom-polyglot-platform.selectorLabels" . | nindent 8  }}
        app.kubernetes.io/component: inventory
    spec:
      containers:
        - name: inventory
          image: "{{ .Values.inventory.image.repository }}:{{ .Values.inventory.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          resources:
            requests:
              cpu: {{ .Values.inventory.resources.requests.cpu | quote }}
              memory: {{ .Values.inventory.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.inventory.resources.limits.cpu | quote }}
              memory: {{ .Values.inventory.resources.limits.memory | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.inventory.service.port }}
              protocol: TCP
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecom-polyglot-platform.fullname" . }}-secret
                  key: DB_USER
            
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecom-polyglot-platform.fullname" . }}-secret
                  key: DB_PASSWORD

            - name: INVENTORY_DB_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@postgres-db:{{ .Values.global.database.serverPort }}/inventory_db"

---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  labels:
    {{- include "ecom-polyglot-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: inventory
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.inventory.service.port }} 
      containerPort: http
      protocol: TCP 
  selector:
    {{- include "ecom-polyglot-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: inventory
