---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecom-polyglot-platform.fullname" }}
  labels:
    {{- include "ecom-polyglot-platform.labels" . | nindent 4 -}}
    app.kubernetes.io/component: auth
spec:
  replicas: {{ .Values.auth.replicaCount }}
  selector:
    matchLabels:
      {{- include "ecom-polyglot-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: auth
  template:
    metadata:
      labels:
        {{- include "ecom-polyglot-platform.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: auth
          image: "{{ .Values.auth.image.repository }}:{{ .Values.auth.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.auth.service.port }}
              protocol: TCP
          env:
            - name: AUTH_DB_URL
              value: "jdbc:postgresql://postgres-db:5432/auth_db"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.database.credentialSecret }}
                  key: {{ .Values.global.database.usernameKey }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.database.credentialSecret }}
                  key: {{ .Values.global.database.passwordKey }}
          resources:
            requests:
              memory: "{{ .Values.auth.resources.requests.memory }}"
              cpu: "{{ .Values.auth.resources.requests.cpu }}"
            limits:
              memory: "{{ .Values.auth.resources.limits.memory }}"
              cpu: "{{ .Values.auth.resources.limits.cpu }}"

---
apiVersion: v1
kind: Service
metadata:
  name: auth
  labels:
    {{- include "ecom-polyglot-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  type: {{ .Values.auth.service.type }}
  ports:
   - name: http
     port: {{ .Values.auth.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ecom-polyglot-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: auth
