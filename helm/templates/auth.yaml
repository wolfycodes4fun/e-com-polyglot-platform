---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecom-polyglot-platform.fullname" . }}-auth
  labels:
    {{- include "ecom-polyglot-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  replicas: {{ .Values.auth.replicaCount }}
  selector:
    matchLabels:
      {{- include "ecom-polyglot-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: auth
  template:
    metadata:
      labels:
        {{- include "ecom-polyglot-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: auth
    spec:
      containers:
        - name: auth
          image: "{{ .Values.auth.image.repository }}:{{ .Values.auth.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          resources:
            requests:
              cpu: {{ .Values.auth.resources.requests.cpu | quote }}
              memory: {{ .Values.auth.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.auth.resources.limits.cpu | quote }}
              memory: {{ .Values.auth.resources.limits.memory | quote }} 
          ports:
            - name: http
              containerPort: {{ .Values.auth.service.port }}
              protocol: TCP
          env:
            - name: AUTH_DB_URL
              value: "jdbc:postgresql://postgres-db:{{ .Values.global.database.serverPort }}/auth_db"

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecom-polyglot-platform.fullname" . }}-secret
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecom-polyglot-platform.fullname" . }}-secret
                  key: DB_PASSWORD

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    {{- include "ecom-polyglot-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  type: {{ .Values.auth.service.type }}
  ports:
    - name: http
      port: {{ .Values.auth.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ecom-polyglot-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: auth
